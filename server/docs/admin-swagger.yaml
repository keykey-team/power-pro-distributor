openapi: 3.0.3
info:
  title: FitWin Admin API
  version: 1.0.0
  description: |
    Админ API для управления товарами и складскими операциями.

    Включает:
    - расширенный CRUD товаров
    - гибкую фильтрацию товаров для админ-панели
    - складские позиции и сводку
    - оприходования, списания и инвентаризации
    - журнал движений склада

servers:
  - url: http://localhost:5001/api/admin
    description: Локальный сервер

tags:
  - name: Админ Товары
  - name: Админ Склад
  - name: Админ Загрузка
  - name: Админ Логи

paths:
  /products:
    get:
      tags: [Админ Товары]
      summary: Список товаров для админ-панели
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
        - in: query
          name: q
          schema:
            type: string
          description: Поиск по id, slug, названию товара, подзаголовку, бренду или типу.
        - in: query
          name: ids
          schema:
            type: string
          description: Идентификаторы товаров через запятую.
        - in: query
          name: slugs
          schema:
            type: string
          description: Слаги товаров через запятую.
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: inStock
          schema:
            type: boolean
        - in: query
          name: hasTrackedStock
          schema:
            type: boolean
        - in: query
          name: hasVariants
          schema:
            type: boolean
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: types
          schema:
            type: string
          description: Типы товаров через запятую.
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: sort
          schema:
            type: string
          description: "Сортировка через запятую, например: -updatedAt,slug"
        - in: query
          name: includeDisabledPurchaseOptions
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Товары загружены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductListResponse"
    post:
      tags: [Админ Товары]
      summary: Создать товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpsertRequest"
      responses:
        "201":
          description: Товар создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/meta:
    get:
      tags: [Админ Товары]
      summary: Загрузить фильтры и счетчики товаров
      responses:
        "200":
          description: Метаинформация загружена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductMetaResponse"

  /products/export:
    get:
      tags: [Админ Товары]
      summary: Экспортировать товары в CSV или XLSX
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
          description: Формат экспортного файла.
        - in: query
          name: q
          schema:
            type: string
          description: Поиск по id, slug, названию, бренду или типу.
        - in: query
          name: ids
          schema:
            type: string
          description: Идентификаторы товаров через запятую.
        - in: query
          name: slugs
          schema:
            type: string
          description: Слаги товаров через запятую.
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: inStock
          schema:
            type: boolean
        - in: query
          name: hasTrackedStock
          schema:
            type: boolean
        - in: query
          name: hasVariants
          schema:
            type: boolean
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: types
          schema:
            type: string
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: sort
          schema:
            type: string
          description: "Сортировка через запятую, например: -updatedAt,slug"
      responses:
        "200":
          description: Файл экспорта сформирован
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Некорректный формат экспорта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Ошибка формирования экспорта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productRef}:
    get:
      tags: [Админ Товары]
      summary: Получить товар по id или slug
      parameters:
        - in: path
          name: productRef
          required: true
          schema:
            type: string
          description: Идентификатор или slug товара.
        - in: query
          name: includeDisabledPurchaseOptions
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Товар загружен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Админ Товары]
      summary: Полностью обновить товар по MongoDB id
      parameters:
        - in: path
          name: productRef
          required: true
          description: Идентификатор товара в MongoDB.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpsertRequest"
      responses:
        "200":
          description: Товар обновлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Админ Товары]
      summary: Частично обновить товар по MongoDB id
      parameters:
        - in: path
          name: productRef
          required: true
          description: Идентификатор товара в MongoDB.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpsertRequest"
      responses:
        "200":
          description: Товар обновлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Админ Товары]
      summary: Удалить товар по MongoDB id
      parameters:
        - in: path
          name: productRef
          required: true
          description: Идентификатор товара в MongoDB.
          schema:
            type: string
      responses:
        "200":
          description: Товар удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "404":
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inventory/summary:
    get:
      tags: [Админ Склад]
      summary: Получить сводку остатков по отфильтрованным позициям
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: positionType
          schema:
            type: string
            enum: [all, product, purchase_option]
            default: all
        - in: query
          name: trackedOnly
          schema:
            type: boolean
        - in: query
          name: inStock
          schema:
            type: boolean
        - in: query
          name: lowStockMax
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Сводка загружена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySummary"

  /inventory/positions:
    get:
      tags: [Админ Склад]
      summary: Список складских позиций по товарам и вариантам покупки
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: positionType
          schema:
            type: string
            enum: [all, product, purchase_option]
            default: all
        - in: query
          name: trackedOnly
          schema:
            type: boolean
        - in: query
          name: inStock
          schema:
            type: boolean
        - in: query
          name: enabled
          schema:
            type: boolean
          description: Применяется только к строкам вариантов покупки.
        - in: query
          name: minStock
          schema:
            type: integer
        - in: query
          name: maxStock
          schema:
            type: integer
        - in: query
          name: lowStockMax
          schema:
            type: integer
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [updatedAt, createdAt, title, stockQuantity, slug]
            default: updatedAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: includeDisabledPurchaseOptions
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Позиции загружены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPositionListResponse"

  /inventory/movements:
    get:
      tags: [Админ Склад]
      summary: Журнал движений склада
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: operationType
          schema:
            type: string
          description: "Значения через запятую, например: receipt,writeoff"
        - in: query
          name: scope
          schema:
            type: string
          description: "Значения через запятую, например: product,purchase_option"
        - in: query
          name: productId
          schema:
            type: string
        - in: query
          name: purchaseOptionKey
          schema:
            type: string
        - in: query
          name: reference
          schema:
            type: string
        - in: query
          name: createdBy
          schema:
            type: string
        - in: query
          name: includeMeta
          schema:
            type: boolean
            default: false
        - in: query
          name: createdFrom
          schema:
            type: string
            format: date-time
        - in: query
          name: createdTo
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Движения загружены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovementListResponse"

  /inventory/receipts:
    post:
      tags: [Админ Склад]
      summary: Оприходовать товар на склад
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryReceiptRequest"
      responses:
        "200":
          description: Оприходование выполнено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMutationResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inventory/writeoffs:
    post:
      tags: [Админ Склад]
      summary: Списать товар со склада
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryReceiptRequest"
      responses:
        "200":
          description: Списание выполнено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMutationResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inventory/recounts:
    post:
      tags: [Админ Склад]
      summary: Провести инвентаризацию и установить точные остатки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryRecountRequest"
      responses:
        "200":
          description: Инвентаризация выполнена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMutationResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /upload/image:
    post:
      tags: [Админ Загрузка]
      summary: Загрузить и конвертировать одно изображение в WebP
      description: |
        Загружает одно изображение и конвертирует его в WebP с минимальным сжатием (качество: 75).

        Поддерживаемые форматы: JPG, PNG, GIF, WebP, BMP, TIFF и другие.
        Максимальный размер файла: 5 МБ
        Возвращает: данные WebP в Base64 с метаданными и статистикой сжатия
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Файл изображения (любой формат)
      responses:
        "200":
          description: Изображение успешно обработано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Файл слишком большой
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Ошибка обработки изображения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /upload/gallery:
    post:
      tags: [Админ Загрузка]
      summary: Загрузить и конвертировать несколько изображений в WebP (пакетно)
      description: |
        Загружает несколько изображений и конвертирует каждое в WebP с минимальным сжатием (качество: 75).

        Максимум файлов: 50 за запрос
        Максимальный размер файла: 5 МБ per file
        Возвращает: массив данных WebP в Base64 с метаданными для каждого изображения
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - images
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Файлы изображений (любой формат)
      responses:
        "200":
          description: Изображения успешно обработаны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryUploadResponse"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Файл(ы) слишком большие
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Ошибка обработки изображения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /logs:
    get:
      tags: [Админ Логи]
      summary: Список логов операций с фильтрацией
      description: |
        Получить журнал всех операций с гибкой фильтрацией и пагинацией.
        
        Поддерживает фильтрацию по:
        - типу операции (create, update, delete, mutation)
        - типу сущности (Product, Inventory, ImageUpload)
        - статусу (success, failed)
        - диапазону дат
        - ID пользователя
      parameters:
        - in: query
          name: operationType
          schema:
            type: string
            enum: [create, read, update, delete, mutation]
        - in: query
          name: entityType
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [success, failed]
        - in: query
          name: userId
          schema:
            type: string
        - in: query
          name: entityId
          schema:
            type: string
        - in: query
          name: fromDate
          schema:
            type: string
            format: date-time
        - in: query
          name: toDate
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 500
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Логи успешно получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationLog"

  /logs/summary:
    get:
      tags: [Админ Логи]
      summary: Получить сводную статистику операций
      description: Агрегированная статистика операций (всего, успешность, по типам и т.д.)
      parameters:
        - in: query
          name: operationType
          schema:
            type: string
        - in: query
          name: entityType
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Сводная статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  summary:
                    $ref: "#/components/schemas/LogsSummary"

  /logs/failed:
    get:
      tags: [Админ Логи]
      summary: Получить все неуспешные операции
      description: Получить неуспешные операции для отладки
      parameters:
        - in: query
          name: operationType
          schema:
            type: string
        - in: query
          name: entityType
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Неуспешные операции
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  failedCount:
                    type: integer
                  failed:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationLog"

  /logs/entity/{entityType}/{entityId}:
    get:
      tags: [Админ Логи]
      summary: Получить историю операций по конкретной сущности
      description: Получить все операции, затрагивающие конкретную сущность
      parameters:
        - in: path
          name: entityType
          required: true
          schema:
            type: string
        - in: path
          name: entityId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: История операций сущности
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  entityType:
                    type: string
                  entityId:
                    type: string
                  operationsCount:
                    type: integer
                  operations:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationLog"

  /logs/user/{userId}:
    get:
      tags: [Админ Логи]
      summary: Получить логи активности пользователя
      description: Получить все операции, выполненные конкретным пользователем
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Активность пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  activitiesCount:
                    type: integer
                  activities:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationLog"

  /logs/cleanup:
    post:
      tags: [Админ Логи]
      summary: Удалить старые логи
      description: Удалить логи старше N дней (обслуживание)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                daysOld:
                  type: integer
                  default: 90
                  description: Удалить логи старше указанного количества дней
      responses:
        "200":
          description: Очистка завершена
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deletedCount:
                    type: integer
                  message:
                    type: string

components:
  schemas:
    LocalizedString:
      type: object
      properties:
        ua:
          type: string
        ru:
          type: string
        en:
          type: string
        sk:
          type: string

